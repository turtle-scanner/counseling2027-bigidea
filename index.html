<!DOCTYPE html>
<html lang="ko" data-theme="dark" style="background-color: #101010; color: #ffffff;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>counseling2027 bigidea | 전문상담 임용고시 핵심교재</title>
  <meta name="theme-color" content="#101010">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="counseling2027 bigidea">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=20270905_3">
  <!-- Pretendard 폰트 최적화 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body style="background-color: #101010; color: #ffffff;">

  <!-- Top Navbar -->
  <header class="top-navbar">
    <div class="brand-section">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="메뉴 열기">☰</button>
      <span class="brand-badge">2027</span>
      <h1 class="brand-title">counseling2027 <span class="brand-title-accent">bigidea</span></h1>
    </div>

    <div class="navbar-controls">
      <!-- 25분 포모도로 집중 타이머 -->
      <div class="pomodoro-box" title="ADHD 집중력을 위한 25분 몰입 타이머">
        <span>⏱️</span>
        <span class="pomodoro-display" id="pomoTimeDisplay">25:00</span>
        <button class="pomo-btn" id="pomoStartBtn" title="시작/일시정지">▶</button>
        <button class="pomo-btn reset" id="pomoResetBtn" title="리셋">⟲</button>
      </div>

      <!-- Active Recall (키워드 블라인드 인출) 토글 -->
      <button class="btn-blind-toggle" id="btnBlindToggle" title="핵심 채점 키워드를 가려 인출 훈련을 합니다">
        <span>👁️</span>
        <span class="blind-text-desktop">키워드 가리기</span>
        <span class="blind-text-mobile">인출</span>
      </button>

      <!-- 글자 크기 조절 컨트롤 박스 (태블릿 및 모바일 최적화) -->
      <div class="font-size-box" title="태블릿/모바일 글자 크기 조절">
        <button class="btn-font-step" id="btnFontDecrease" aria-label="글자 작게" title="글자 축소">A-</button>
        <span class="font-size-display" id="fontSizeDisplay" title="현재 글자 크기">100%</span>
        <button class="btn-font-step" id="btnFontIncrease" aria-label="글자 크게" title="글자 확대">A+</button>
        <button class="btn-font-reset" id="btnFontReset" title="기본 크기(100%) 복원">100%</button>
      </div>
    </div>
  </header>

  <!-- Mobile Drawer Backdrop -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- App Body Layout -->
  <div class="app-container">
    
    <!-- Sidebar: Index & Search -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-top-bar">
          <span class="sidebar-top-title">📋 과목별 목차 (총 61주제)</span>
          <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="메뉴 닫기">✕</button>
        </div>

        <!-- 검색창 -->
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="이론, 학자, 키워드 검색...">
        </div>

        <!-- 출제예상 필터 -->
        <div class="filter-chips">
          <button class="chip-btn active" id="chipAll">전체 보기</button>
          <button class="chip-btn" id="chipP3">★★★ 올해 0순위만</button>
        </div>

        <!-- 학습 진행률 -->
        <div class="progress-bar-container">
          <div class="progress-labels">
            <span>학습 진도율</span>
            <span id="progressPercent">0% (0/61)</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>

      <!-- 목차 스크롤 영역 -->
      <nav class="nav-scroll-area" id="sidebarNav">
        <!-- JS로 동적 렌더링됨 -->
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- 간소화된 ADHD 핵심 학습 가이드 칩 바 -->
      <div class="intro-banner compact" id="introBanner">
        <div class="intro-banner-inner">
          <div class="intro-compact-left">
            <span class="intro-tag">🎯 핵심 압축</span>
            <span class="intro-compact-text">
              4열 핵심표 & 청킹 공식 | 상단 <strong>[👁️ 키워드 가리기]</strong>로 능동 인출 훈련
            </span>
          </div>
          <div class="intro-compact-right">
            <span class="intro-mini-badge">11과목 · 61테마</span>
            <button class="intro-close-btn" id="btnIntroClose" onclick="dismissIntroBanner()" title="가이드 숨기기" aria-label="가이드 숨기기">✕</button>
          </div>
        </div>
      </div>

      <!-- 본문 동적 렌더링 영역 -->
      <div id="contentArea">
        <!-- JS로 동적 렌더링됨 -->
      </div>
    </main>
  </div>

  <!-- Floating Jump Actions -->
  <div class="floating-actions">
    <button class="btn-float btn-float-font" id="btnFloatFont" title="태블릿 글자 크기 조절" aria-label="글자 크기 조절">🗚</button>
    <button class="btn-float btn-float-menu" id="btnFloatMenu" title="목차 열기" aria-label="목차 열기">📑</button>
    <button class="btn-float btn-float-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="맨 위로 이동" aria-label="맨 위로 이동">↑</button>
  </div>

  <!-- Tablet / Mobile Font Size Quick Popover Panel -->
  <div class="font-popup-panel" id="fontPopupPanel" aria-hidden="true">
    <div class="font-popup-header">
      <div class="font-popup-title">
        <span>🗚 글자 크기 조절</span>
        <span class="font-current-pill" id="fontPopupPercent">100%</span>
      </div>
      <button class="font-popup-close" id="btnFontPopupClose" aria-label="닫기">✕</button>
    </div>
    <div class="font-preset-group">
      <div class="font-preset-label">태블릿 원클릭 추천 크기:</div>
      <div class="font-preset-buttons">
        <button class="btn-preset" data-size="14">88% (작게)</button>
        <button class="btn-preset active" data-size="16">100% (기본)</button>
        <button class="btn-preset" data-size="19">120% (태블릿)</button>
        <button class="btn-preset" data-size="22">140% (크게)</button>
        <button class="btn-preset" data-size="26">165% (특대)</button>
      </div>
    </div>
    <div class="font-stepper-group">
      <button class="btn-stepper" id="btnStepperDec">− 축소</button>
      <button class="btn-stepper reset" id="btnStepperReset">⟲ 100% 기본</button>
      <button class="btn-stepper inc" id="btnStepperInc">+ 확대</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="data.js?v=20270905_3"></script>
  <script src="app.js?v=20270905_3"></script>
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=20270905_3').catch(err => console.log('SW registration note:', err));
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>counseling2027 bigidea | 전문상담 임용고시 핵심교재</title>
  <meta name="theme-color" content="#101010">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="counseling2027 bigidea">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <!-- Pretendard 폰트 최적화 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>

  <!-- Top Navbar -->
  <header class="top-navbar">
    <div class="brand-section">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="메뉴 열기">☰</button>
      <span class="brand-badge">2027</span>
      <h1 class="brand-title">counseling2027 <span class="brand-title-accent">bigidea</span></h1>
    </div>

    <div class="navbar-controls">
      <!-- 25분 포모도로 집중 타이머 -->
      <div class="pomodoro-box" title="ADHD 집중력을 위한 25분 몰입 타이머">
        <span>⏱️</span>
        <span class="pomodoro-display" id="pomoTimeDisplay">25:00</span>
        <button class="pomo-btn" id="pomoStartBtn" title="시작/일시정지">▶</button>
        <button class="pomo-btn reset" id="pomoResetBtn" title="리셋">⟲</button>
      </div>

      <!-- Active Recall (키워드 블라인드 인출) 토글 -->
      <button class="btn-blind-toggle" id="btnBlindToggle" title="핵심 채점 키워드를 가려 인출 훈련을 합니다">
        <span>👁️</span>
        <span class="blind-text-desktop">키워드 가리기 (인출 훈련)</span>
        <span class="blind-text-mobile">인출 모드</span>
      </button>

      <!-- 폰트 크기 조절 -->
      <button class="btn-tool" id="btnFontDecrease" title="글자 작게">A-</button>
      <button class="btn-tool" id="btnFontIncrease" title="글자 크게">A+</button>

      <!-- 다크/라이트 모드 -->
      <button class="btn-tool" id="btnThemeToggle" title="테마 변경">🌙</button>
    </div>
  </header>

  <!-- Mobile Drawer Backdrop -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- App Body Layout -->
  <div class="app-container">
    
    <!-- Sidebar: Index & Search -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-top-bar">
          <span class="sidebar-top-title">📋 과목별 목차 (총 61주제)</span>
          <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="메뉴 닫기">✕</button>
        </div>

        <!-- 검색창 -->
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="이론, 학자, 키워드 검색...">
        </div>

        <!-- 출제예상 필터 -->
        <div class="filter-chips">
          <button class="chip-btn active" id="chipAll">전체 보기</button>
          <button class="chip-btn" id="chipP3">★★★ 올해 0순위만</button>
        </div>

        <!-- 학습 진행률 -->
        <div class="progress-bar-container">
          <div class="progress-labels">
            <span>학습 진도율</span>
            <span id="progressPercent">0% (0/61)</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>

      <!-- 목차 스크롤 영역 -->
      <nav class="nav-scroll-area" id="sidebarNav">
        <!-- JS로 동적 렌더링됨 -->
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- ADHD 학습 전략 인트로 배너 -->
      <div class="intro-banner">
        <div class="intro-banner-inner">
          <div>
            <h2 class="intro-title">🎯 2027 전문상담 임용 합격을 위한 ADHD 최적화 학습 가이드</h2>
            <p class="intro-desc">
              긴 줄글을 모두 걷어내고 <strong>[4열 핵심 표]</strong>와 <strong>[비교 대조표]</strong>, <strong>[초단기 청킹 공식]</strong>으로만 압축했습니다.<br>
              상단의 <strong>[👁️ 키워드 가리기]</strong> 버튼을 켜서 직접 정답을 맞추는 능동적 인출(Active Recall) 학습을 실천하세요!
            </p>
          </div>
          <div class="intro-stats-badge">
            📚 11대 과목 · 총 61개 핵심 테마<br>
            ✨ 김진구 2026/2027 최신 개념코드 반영
          </div>
        </div>
      </div>

      <!-- 본문 동적 렌더링 영역 -->
      <div id="contentArea">
        <!-- JS로 동적 렌더링됨 -->
      </div>
    </main>
  </div>

  <!-- Floating Jump Actions -->
  <div class="floating-actions">
    <button class="btn-float btn-float-menu" id="btnFloatMenu" title="목차 열기">📑</button>
    <button class="btn-float btn-float-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="맨 위로 이동">↑</button>
  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration note:', err));
      });
    }
  </script>
</body>
</html>
